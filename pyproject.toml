# Tool configuration only. Dependencies are pinned in requirements*.txt
# (Streamlit Community Cloud reads requirements.txt).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Cyrillic text in rules and UI strings is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]
